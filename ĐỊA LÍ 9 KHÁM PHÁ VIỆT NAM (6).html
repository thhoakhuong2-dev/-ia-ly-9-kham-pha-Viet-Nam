mark{background:linear-gradient(transparent 30%,var(--hy) 30%);color:inherit;padding:0 3px;border-radius:4px;font-weight:700}mark.mg2{background:linear-gradient(transparent 30%,var(--hg) 30%)}

var $=function(s){return document.querySelector(s)},E=function(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var LV=["Nhận biết","Thông hiểu","Vận dụng"];
function Y(id,t,topic,p,goal,warm,key,task,tb){return{id:id,t:t,topic:topic,p:p,ready:true,goal:goal,warm:warm,key:key,task:task,tb:tb}}
var SRC="Nguồn: SGK Lịch sử và Địa lí 9 (Kết nối tri thức), số liệu Cục Thống kê.";
var Y5=["Năm","2010","2015","2020","2024"];
function X(id,t,topic,p){return{id:id,t:t,topic:topic,p:p,ready:false}}
var C1="Chương 1 – Địa lí dân cư",C2="Chương 2 – Địa lí các ngành kinh tế",C3="Chương 3 – Địa lí các vùng kinh tế – xã hội",C4="Chủ đề chung";
var LESSONS=[
Y("b1","Bài 1. Dân tộc và dân số",C1,117,["Trình bày được đặc điểm phân bố các dân tộc ở Việt Nam.","Trình bày được quy mô dân số và tình hình gia tăng dân số qua các thời kì.","Phân tích được sự thay đổi cơ cấu tuổi và giới tính của dân cư."],"Dân cư là nguồn lực đặc biệt đối với phát triển kinh tế. Em hãy nêu một hiểu biết về dân tộc và dân số nước ta.",["Nước ta có 54 dân tộc: dân tộc Kinh chiếm khoảng 85%, các dân tộc thiểu số khoảng 15% tổng số dân (2024). Có hơn 5 triệu người Việt sinh sống ở nước ngoài.","Người Kinh sống khắp cả nước, tập trung ở đồng bằng, ven biển, trung du; các dân tộc thiểu số chủ yếu ở đồi núi, cao nguyên (Tày, H’Mông, Thái, Mường ở Trung du và miền núi phía Bắc; Gia-rai, Ê-đê, Ba-na ở Duyên hải Nam Trung Bộ và Tây Nguyên; Khơ-me, Hoa ở đồng bằng ven biển phía nam và Đồng bằng sông Cửu Long).","Năm 2024 dân số nước ta là 101,3 triệu người, đứng thứ 16 thế giới và thứ ba Đông Nam Á; tỉ lệ gia tăng giảm nhưng mỗi năm vẫn tăng khoảng 1 triệu người.","Tỉ lệ dưới 15 tuổi giảm, từ 65 tuổi trở lên tăng (9,3% năm 2024): nước ta đang trong thời kì dân số vàng và có xu hướng già hoá. Tỉ số giới tính năm 2024 là 99,6 nam/100 nữ."],"Vẽ biểu đồ số dân và tỉ lệ tăng dân số giai đoạn 1999 – 2024 từ bảng 1.1 rồi nêu nhận xét.",{c:"Bảng 1.1. Số dân và tỉ lệ tăng dân số",h:["Năm","1999","2009","2019","2024"],r:[["Số dân (triệu người)","76,5","86,0","96,5","101,3"],["Tỉ lệ tăng dân số (%)","1,51","1,06","1,15","1,03"]]}),
Y("b2","Bài 2. Phân bố dân cư và các loại hình quần cư",C1,120,["Đọc bản đồ dân số Việt Nam để rút ra đặc điểm phân bố dân cư.","Trình bày được sự khác biệt giữa quần cư thành thị và quần cư nông thôn."],"Phân bố dân cư chịu tác động tổng hợp của các nhân tố tự nhiên, kinh tế – xã hội. Phân bố dân cư nước ta có đặc điểm gì?",["Mật độ dân số năm 2024 là 306 người/km², gấp khoảng 5 lần mức bình quân thế giới, đứng thứ ba Đông Nam Á (sau Xin-ga-po và Phi-líp-pin).","Phân bố không đều: đồng bằng, ven biển đông dân; miền núi thưa dân. Đồng bằng sông Hồng có mật độ cao nhất (1 034 người/km²), Trung du và miền núi phía Bắc thấp nhất (136 người/km²).","Tỉ lệ dân thành thị tăng từ 19,5% (1990) lên 38,5% (2024); dân nông thôn vẫn chiếm 61,5%. Một số đô thị lớn: TP. Hồ Chí Minh, Hà Nội, Đà Nẵng, Hải Phòng.","Quần cư nông thôn và quần cư thành thị khác nhau về mật độ, cấu trúc, hoạt động kinh tế và chức năng (xem bảng)."],"Mô tả đặc điểm quần cư nơi em sinh sống.",{c:"Bảng 2. Đặc điểm của quần cư nông thôn và quần cư thành thị",h:["Tiêu chí","Quần cư nông thôn","Quần cư thành thị"],r:[["Mật độ dân số","Thấp","Cao"],["Cấu trúc quần cư","Xã, thôn, xóm, bản…","Phường, tổ dân phố…"],["Hoạt động kinh tế","Nông nghiệp là chủ yếu","Công nghiệp, dịch vụ là chủ yếu"],["Chức năng","Hành chính, văn hoá, xã hội; đang đa dạng hoá","Đa chức năng: trung tâm kinh tế, văn hoá, chính trị, đổi mới sáng tạo…"]]}),
Y("b3","Bài 3. Lao động và việc làm",C1,123,["Nêu được đặc điểm nguồn lao động nước ta.","Trình bày được thực trạng sử dụng nguồn lao động.","Trình bày được thực trạng vấn đề việc làm và phương hướng giải quyết việc làm."],"Việc sử dụng lao động đang diễn ra như thế nào và vấn đề việc làm cần quan tâm ra sao?",["Lực lượng lao động chiếm 52,2% dân số (2024); số lao động có việc làm là 51,9 triệu người. Tỉ lệ lao động đã qua đào tạo là 28,4%, Đồng bằng sông Hồng cao nhất cả nước.","Cơ cấu lao động chuyển dịch theo hướng giảm nông – lâm – thuỷ sản, tăng công nghiệp – xây dựng và dịch vụ.","Năm 2024: thất nghiệp 2,24%, thiếu việc làm 1,85%; thất nghiệp thanh niên (15 – 24 tuổi) gần 8%, gấp 3,5 lần tỉ lệ chung.","Giải pháp: đẩy mạnh phát triển kinh tế, hoàn thiện chính sách lao động, nâng cao chất lượng đào tạo nghề, phát triển hệ thống thông tin thị trường lao động, hợp tác quốc tế về lao động."],"Lập bảng thực trạng sử dụng lao động theo ngành kinh tế và theo thành phần kinh tế (biểu hiện, nguyên nhân, ý nghĩa).",{c:"Cơ cấu lao động có việc làm theo ngành kinh tế (%)",h:Y5,r:[["Nông nghiệp, lâm nghiệp và thuỷ sản","49,5","43,6","33,1","26,4"],["Công nghiệp và xây dựng","20,9","23,0","30,8","33,4"],["Dịch vụ","29,6","33,4","36,1","40,2"]]}),
Y("b4","Bài 4. Thực hành: Tìm hiểu vấn đề việc làm ở địa phương và phân hoá thu nhập theo vùng",C1,127,["Phân tích được vấn đề việc làm ở địa phương.","Nhận xét được sự phân hoá thu nhập theo vùng từ bảng số liệu."],"Thu nhập của người dân ở các vùng có giống nhau không?",["Nhiệm vụ 1: sưu tầm tư liệu, viết báo cáo về việc làm ở địa phương gồm thực trạng, giải pháp và ý nghĩa.","Nhiệm vụ 2: năm 2024 thu nhập bình quân đầu người một tháng cao nhất ở Đông Nam Bộ (6 868 nghìn đồng), thấp nhất ở Trung du và miền núi phía Bắc (3 749 nghìn đồng); thu nhập các vùng đều tăng so với năm 2010."],"Nhận xét sự thay đổi thu nhập của từng vùng năm 2024 so với 2010 và sự phân hoá giữa các vùng.",{c:"Thu nhập bình quân đầu người một tháng (nghìn đồng)",h:["Vùng","2010","2024"],r:[["Trung du và miền núi phía Bắc","907","3 749"],["Đồng bằng sông Hồng","1 561","6 480"],["Bắc Trung Bộ","903","4 630"],["Duyên hải Nam Trung Bộ và Tây Nguyên","1 127","4 360"],["Đông Nam Bộ","2 212","6 868"],["Đồng bằng sông Cửu Long","1 243","4 770"]]}),
Y("b5","Bài 5. Nông nghiệp",C2,129,["Phân tích được một trong các nhân tố chính ảnh hưởng tới sự phát triển và phân bố nông nghiệp.","Trình bày được sự phát triển và phân bố nông nghiệp."],"Nền nông nghiệp nước ta là nền nông nghiệp nhiệt đới. Em biết gì về nông nghiệp Việt Nam?",["Nhân tố tự nhiên: 3/4 diện tích là đồi núi, đồng bằng chiếm 1/4; khí hậu nhiệt đới ẩm; nguồn nước, sinh vật thuận lợi nhưng đất thoái hoá, sâu bệnh, thiên tai gây khó khăn.","Nhân tố kinh tế – xã hội: dân cư và lao động, chính sách, khoa học – công nghệ và cơ sở vật chất – kĩ thuật, thị trường.","Năm 2024 trồng trọt chiếm 65,3%, chăn nuôi 30,6% giá trị sản xuất nông nghiệp. Lúa là cây lương thực chính; hai vùng trồng lúa trọng điểm là Đồng bằng sông Cửu Long và Đồng bằng sông Hồng.","Cây công nghiệp lâu năm: chè (Trung du và miền núi phía Bắc, Tây Nguyên); cà phê, cao su, điều, hồ tiêu (Duyên hải Nam Trung Bộ và Tây Nguyên, Đông Nam Bộ). Trâu nhiều nhất ở Trung du và miền núi phía Bắc, bò nhiều nhất ở Duyên hải Nam Trung Bộ và Tây Nguyên."],"Vẽ sơ đồ các nhân tố ảnh hưởng đến nông nghiệp và nhận xét bảng 5.1.",{c:"Diện tích gieo trồng và sản lượng lương thực có hạt",h:Y5,r:[["Diện tích gieo trồng (triệu ha)","8,6","9,0","8,2","8,0"],["– Trong đó: Lúa","7,5","7,8","7,3","7,1"],["Sản lượng (triệu tấn)","44,6","50,4","47,4","47,9"],["– Trong đó: Lúa","40,0","45,1","42,8","43,5"]]}),
Y("b6","Bài 6. Lâm nghiệp và thủy sản",C2,136,["Phân tích được một trong các nhân tố chính ảnh hưởng tới phát triển và phân bố lâm nghiệp, thuỷ sản.","Trình bày được sự phát triển và phân bố lâm nghiệp, thuỷ sản."],"Lâm nghiệp và thuỷ sản có vai trò gì với phát triển kinh tế – xã hội, bảo vệ môi trường?",["Năm 2024 diện tích rừng khoảng 14,9 triệu ha, độ che phủ 42%; Trung du và miền núi phía Bắc có diện tích rừng lớn nhất (gần 36%). Rừng gồm rừng sản xuất, rừng phòng hộ, rừng đặc dụng.","Sản lượng gỗ khai thác năm 2024 khoảng 24 triệu m³ (gấp 6 lần năm 2010); trồng rừng mới khoảng 304 nghìn ha, chủ yếu là rừng sản xuất.","Thuỷ sản: hơn 500 loài cá nước ngọt, hơn 2 000 loài cá biển; năm 2024 chiếm 22,6% giá trị sản xuất nông – lâm – thuỷ sản, nuôi trồng chiếm gần 60% sản lượng.","Đồng bằng sông Cửu Long có sản lượng thuỷ sản khai thác và nuôi trồng lớn nhất cả nước; thuỷ sản xuất khẩu sang Hoa Kỳ, EU…"],"Tính cơ cấu sản lượng thuỷ sản khai thác và nuôi trồng và nhận xét sự thay đổi giai đoạn 2010 – 2024.",{c:"Sản lượng thuỷ sản (triệu tấn)",h:Y5,r:[["Khai thác","2,5","3,2","3,9","3,9"],["Nuôi trồng","2,7","3,6","4,7","5,8"]]}),
Y("b7","Bài 7. Thực hành: Viết báo cáo về một mô hình sản xuất nông nghiệp có hiệu quả",C2,141,["Tìm kiếm thông tin và viết báo cáo về một số mô hình sản xuất nông nghiệp có hiệu quả."],"Em biết mô hình sản xuất nông nghiệp hiệu quả nào ở địa phương?",["Chọn một mô hình: trồng trọt hữu cơ, chăn nuôi tuần hoàn, nông nghiệp thông minh hoặc nuôi trồng thuỷ sản công nghệ cao.","Nguồn tư liệu: cổng thông tin của Bộ Nông nghiệp và Môi trường, của các tỉnh, thành phố, Cục Thống kê; sách, báo, tạp chí.","Cấu trúc báo cáo: mở đầu (giới thiệu mô hình); nội dung chính (sản phẩm, ứng dụng công nghệ, ý nghĩa)."],"Viết báo cáo ngắn về một mô hình em chọn.",null),
Y("b8","Bài 8. Công nghiệp",C2,142,["Phân tích được vai trò của một nhân tố quan trọng ảnh hưởng đến phát triển và phân bố công nghiệp.","Trình bày được sự phát triển và phân bố của một ngành công nghiệp chủ yếu.","Giải thích được tại sao cần phát triển công nghiệp xanh."],"Vì sao nước ta đẩy mạnh phát triển công nghiệp xanh?",["Nhân tố tự nhiên: vị trí gần trung tâm Đông Nam Á; khoáng sản (than, dầu mỏ, khí tự nhiên, bô-xít, a-pa-tit…); sông ngòi có tiềm năng thuỷ điện; nắng và gió thuận lợi cho điện mặt trời, điện gió.","Giá trị sản xuất công nghiệp năm 2024 đạt 16 929,7 nghìn tỉ đồng; công nghiệp tập trung nhất ở Đồng bằng sông Hồng và Đông Nam Bộ.","Sản lượng điện năm 2024 đạt 293,1 tỉ kWh: nhiệt điện 56,6%, thuỷ điện 28,7%, năng lượng tái tạo 12,8%. Ngành chủ yếu: khai khoáng, sản xuất điện, chế biến thực phẩm, điện tử – máy vi tính, dệt – trang phục, giày dép.","Công nghiệp xanh là nền công nghiệp thân thiện với môi trường, tiết kiệm tài nguyên và năng lượng, giảm chất thải; Việt Nam phát triển điện mặt trời, điện gió, điện rác, xử lí nước thải…"],"Vẽ sơ đồ các nhân tố ảnh hưởng đến công nghiệp; nhận xét bảng 8.3.",{c:"Sản lượng khai thác một số khoáng sản",h:Y5,r:[["Dầu thô (triệu tấn)","15,0","18,7","11,5","9,9"],["Than sạch (triệu tấn)","44,8","41,7","44,6","45,3"],["Khí tự nhiên (tỉ m³)","9,4","10,7","9,2","6,4"]]}),
Y("b9","Bài 9. Thực hành: Xác định một số hình thức tổ chức lãnh thổ công nghiệp ở nước ta",C2,151,["Xác định được trên bản đồ một số hình thức tổ chức lãnh thổ công nghiệp (khu công nghiệp, khu công nghệ cao)."],"Khu công nghiệp và khu công nghệ cao thường nằm ở đâu?",["Dựa vào bản đồ công nghiệp Việt Nam năm 2024 (hình 8.1) và bản đồ hành chính để xác định.","Lập bảng gồm: hình thức tổ chức lãnh thổ công nghiệp – tên khu công nghiệp, khu công nghệ cao – thuộc tỉnh, thành phố (mỗi loại 5 ví dụ)."],"Hoàn thành bảng 3 cột theo mẫu của sách.",null),
Y("b10","Bài 10. Dịch vụ",C2,152,["Phân tích được vai trò của một nhân tố quan trọng ảnh hưởng đến phát triển và phân bố dịch vụ.","Xác định được trên bản đồ các tuyến đường bộ huyết mạch, đường sắt, cảng biển lớn, sân bay quốc tế chính.","Trình bày được sự phát triển và phân bố ngành bưu chính viễn thông."],"Các nhân tố nào ảnh hưởng đến phát triển và phân bố ngành dịch vụ?",["Dịch vụ tạo ra sản phẩm phi vật chất, gồm dịch vụ kinh doanh, dịch vụ công và dịch vụ tiêu dùng. Nhân tố ảnh hưởng: phát triển kinh tế, dân cư và lao động, vốn – khoa học công nghệ, cơ sở hạ tầng, chính sách, vị trí địa lí và điều kiện tự nhiên.","Giao thông vận tải: đường bộ (quốc lộ 1, đường Hồ Chí Minh, cao tốc Bắc – Nam phía Đông), đường sắt Thống Nhất Hà Nội – TP. Hồ Chí Minh; 34 cảng biển (2024), đặc biệt là Hải Phòng và Bà Rịa – Vũng Tàu; 23 cảng hàng không, trong đó 12 quốc tế (quan trọng: Nội Bài, Đà Nẵng, Tân Sơn Nhất).","Bưu chính viễn thông: doanh thu năm 2024 đạt 397,3 nghìn tỉ đồng; gần 24 triệu thuê bao internet; trạm trung chuyển internet quốc gia ở Hà Nội, Đà Nẵng, TP. Hồ Chí Minh."],"Xác định trên hình 10.1 các tuyến đường bộ, đường sắt huyết mạch và vị trí cảng biển, cảng hàng không quốc tế.",null),
Y("b11","Bài 11. Thực hành: Tìm hiểu xu hướng phát triển ngành thương mại, du lịch",C2,157,["Phân tích được một số xu hướng phát triển mới trong ngành thương mại và du lịch."],"Thương mại và du lịch hiện nay có gì mới?",["Thương mại: phát triển thương mại điện tử; đa dạng hoá loại hình kinh doanh; đẩy mạnh xuất khẩu mặt hàng thế mạnh, phát triển thương hiệu hàng hoá Việt Nam; đa dạng hoá thị trường xuất, nhập khẩu.","Du lịch: phát triển du lịch bền vững, du lịch thông minh, đa dạng hoá sản phẩm du lịch.","Tư liệu gợi ý: các Quyết định số 1163/QĐ-TTg, 493/QĐ-TTg, 147/QĐ-TTg của Thủ tướng Chính phủ."],"Viết một đoạn phân tích xu hướng mới em ấn tượng nhất.",null),
{id:"vung",t:"Mở đầu chương 3: Sáu vùng kinh tế – xã hội",topic:C3,p:158,ready:true,goal:["Nêu được tên 6 vùng kinh tế – xã hội của nước ta.","Xác định được vùng trên bản đồ và nhận biết phạm vi (các tỉnh, thành phố).","So sánh được diện tích và vị trí của các vùng."],warm:"Quan sát bản đồ: vùng nào có diện tích lớn nhất, vùng nào có Thủ đô Hà Nội và Thành phố Hồ Chí Minh?",key:["Theo Nghị quyết số 252/2025/QH15 (10-12-2025) của Quốc hội, nước ta có 6 vùng kinh tế – xã hội: Trung du và miền núi phía Bắc, Đồng bằng sông Hồng, Bắc Trung Bộ, Duyên hải Nam Trung Bộ và Tây Nguyên, Đông Nam Bộ, Đồng bằng sông Cửu Long.","Diện tích tự nhiên lớn nhất là Duyên hải Nam Trung Bộ và Tây Nguyên (khoảng 99,2 nghìn km²); nhỏ nhất là Đồng bằng sông Hồng (khoảng 23,94 nghìn km²).","Mỗi vùng có vị trí, tự nhiên và dân cư khác nhau nên thế mạnh phát triển khác nhau."],task:"Mở “Bản đồ số”, chọn từng vùng, đọc các tỉnh thành và ghi 1 điểm đặc trưng của mỗi vùng."},
{id:"tdm",t:"Bài 12. Vùng Trung du và miền núi phía Bắc",topic:C3,p:158,ready:true,goal:["Xác định được vị trí địa lí và phạm vi lãnh thổ của vùng.","Trình bày được sự phân hoá thiên nhiên giữa Đông Bắc và Tây Bắc; thế mạnh phát triển kinh tế.","Nhận xét được thành phần dân tộc, phân bố dân cư và chất lượng cuộc sống."],warm:"Vì sao thiên nhiên Đông Bắc và Tây Bắc khác nhau? Điều đó ảnh hưởng thế nào đến kinh tế?",key:["Vùng Trung du và miền núi phía Bắc có diện tích khoảng 92,5 nghìn km² (27,9% cả nước), gồm 9 tỉnh: Cao Bằng, Tuyên Quang, Lào Cai, Thái Nguyên, Lạng Sơn, Phú Thọ, Điện Biên, Lai Châu, Sơn La.","Đông Bắc: núi trung bình, núi thấp, các cánh cung; khoáng sản phong phú (a-pa-tit, sắt, chì – kẽm, đá vôi, than). Tây Bắc: địa hình cao với dãy Hoàng Liên Sơn; sông Đà, sông Mã có tiềm năng thuỷ điện lớn.","Thế mạnh: công nghiệp, lâm – nông – thuỷ sản (cây chè, dược liệu, cây ăn quả), du lịch."],task:"Lập bảng so sánh Đông Bắc và Tây Bắc về địa hình, khí hậu, sông ngòi, khoáng sản."},
{id:"hong",t:"Bài 13. Vùng Đồng bằng sông Hồng",topic:C3,p:166,ready:true,goal:["Trình bày được vị trí địa lí và phạm vi lãnh thổ của vùng.","Phân tích được thế mạnh tài nguyên thiên nhiên đối với nông nghiệp, lâm nghiệp, thuỷ sản.","Phân tích được vấn đề đô thị hoá và vị thế của Thủ đô Hà Nội."],warm:"Vì sao Đồng bằng sông Hồng có lịch sử khai thác lâu đời và vai trò quan trọng với cả nước?",key:["Vùng Đồng bằng sông Hồng có diện tích khoảng 23,94 nghìn km² (7,2% cả nước), gồm Thủ đô Hà Nội, thành phố Hải Phòng và các tỉnh Bắc Ninh, Quảng Ninh, Hưng Yên, Ninh Bình.","Địa hình tương đối bằng phẳng, đất phù sa màu mỡ, thích hợp cây lương thực (nhất là lúa), rau đậu, cây ăn quả; khí hậu nhiệt đới ẩm gió mùa có mùa đông lạnh.","Vùng biển thuộc vịnh Bắc Bộ có nhiều đảo như Cô Tô, Cái Bầu (Quảng Ninh), Cát Bà, Bạch Long Vĩ (Hải Phòng)."],task:"Chỉ trên bản đồ vị trí Hà Nội, Hải Phòng, Quảng Ninh và nêu thuận lợi của vị trí vùng."},
{id:"bt",t:"Bài 14. Vùng Bắc Trung Bộ",topic:C3,p:176,ready:true,goal:["Xác định được trên bản đồ vị trí và phạm vi lãnh thổ của vùng.","Trình bày được đặc điểm tự nhiên và ảnh hưởng đến cơ cấu kinh tế.","Phân tích được thế mạnh du lịch và vấn đề phát triển kinh tế biển."],warm:"Bắc Trung Bộ có điều kiện tự nhiên và tài nguyên phong phú, đa dạng. Vùng có thế mạnh gì?",key:["Vùng Bắc Trung Bộ có diện tích khoảng 51,2 nghìn km² (15,5% cả nước), gồm thành phố Huế và các tỉnh Thanh Hoá, Nghệ An, Hà Tĩnh, Quảng Trị.","Giáp nước láng giềng Lào; phía đông có vùng biển rộng với các đảo như hòn Mê (Thanh Hoá), hòn Ngư (Nghệ An), đảo Yến, Cồn Cỏ (Quảng Trị).","Tự nhiên phân hoá tây – đông: đồi núi phía tây, đồng bằng chuyển tiếp, biển và đảo phía đông; thuận lợi phát triển tổng hợp kinh tế biển."],task:"Mô tả sự phân hoá tự nhiên theo chiều tây – đông của vùng trên bản đồ."},
{id:"b15",t:"Bài 15. Thực hành: Tìm hiểu vấn đề phòng, chống thiên tai và ứng phó với biến đổi khí hậu ở vùng Bắc Trung Bộ",topic:C3,p:185,ready:false},
{id:"nt",t:"Bài 16. Vùng Duyên hải Nam Trung Bộ và Tây Nguyên",topic:C3,p:186,ready:true,goal:["Trình bày được đặc điểm vị trí địa lí và phạm vi lãnh thổ của vùng.","Trình bày được đặc điểm tự nhiên, các thế mạnh và hạn chế chính.","Phân tích được các vấn đề môi trường trong phát triển ở vùng."],warm:"Ngành nào được xác định là ngành kinh tế thế mạnh của vùng? Vì sao?",key:["Vùng Duyên hải Nam Trung Bộ và Tây Nguyên có diện tích lớn nhất nước ta, khoảng 99,2 nghìn km² (29,9%), gồm thành phố Đà Nẵng và các tỉnh Quảng Ngãi, Gia Lai, Đắk Lắk, Khánh Hoà, Lâm Đồng.","Vùng có Hoàng Sa (Đà Nẵng), Trường Sa (Khánh Hoà), Lý Sơn (Quảng Ngãi), Phú Quý (Lâm Đồng); giáp Bắc Trung Bộ, Đông Nam Bộ, Lào, Cam-pu-chia.","Phía tây là các cao nguyên xếp tầng, đất badan màu mỡ, thuận lợi cây công nghiệp lâu năm, cây ăn quả; phía đông là dải đồng bằng ven biển nhỏ hẹp."],task:"Nêu thuận lợi của cao nguyên đất badan và của dải ven biển đối với phát triển kinh tế."},
X("b17x","Bài 17. Vùng Đông Nam Bộ",C3,195),
{id:"dnb",t:"Bài 17. Vùng Đông Nam Bộ",topic:C3,p:195,ready:true,goal:["Trình bày được đặc điểm vị trí địa lí và phạm vi lãnh thổ.","Phân tích được thế mạnh, hạn chế về điều kiện tự nhiên và tài nguyên.","Phân tích được vị thế của Thành phố Hồ Chí Minh."],warm:"Vì sao Đông Nam Bộ là một trong những vùng kinh tế phát triển nhất cả nước?",key:["Vùng Đông Nam Bộ có diện tích hơn 28,0 nghìn km² (8,5% cả nước), gồm Thành phố Hồ Chí Minh và các tỉnh Đồng Nai, Tây Ninh.","Địa hình tương đối bằng phẳng, thuận lợi xây dựng cơ sở công nghiệp, giao thông vận tải, đô thị; đất badan và đất xám phù sa cổ phù hợp cây công nghiệp lâu năm, cây ăn quả.","Vùng là cầu nối giữa Đồng bằng sông Cửu Long với Duyên hải Nam Trung Bộ và Tây Nguyên; Thành phố Hồ Chí Minh là một trong những trung tâm kinh tế lớn nhất cả nước."],task:"Nêu 2 lợi thế về vị trí và địa hình giúp Đông Nam Bộ phát triển công nghiệp và đô thị."},
X("b18","Bài 18. Thực hành: Phân tích ý nghĩa của việc tăng cường kết nối liên vùng đối với sự phát triển của vùng Đông Nam Bộ",C3,204),
{id:"cl",t:"Bài 19. Vùng Đồng bằng sông Cửu Long",topic:C3,p:205,ready:true,goal:["Trình bày được vị trí địa lí và phạm vi lãnh thổ.","Phân tích được thế mạnh, hạn chế về điều kiện tự nhiên và tài nguyên.","Phân tích được đặc điểm dân cư, một số vấn đề xã hội và các ngành kinh tế thế mạnh."],warm:"Vì sao Đồng bằng sông Cửu Long được gọi là vùng châu thổ trù phú?",key:["Vùng Đồng bằng sông Cửu Long có diện tích khoảng 36,4 nghìn km² (11,0% cả nước), gồm thành phố Cần Thơ và các tỉnh Vĩnh Long, Đồng Tháp, An Giang, Cà Mau.","Nằm ở phía tây nam của Tổ quốc, giáp Đông Nam Bộ và Cam-pu-chia; có đảo Phú Quốc, các quần đảo Thổ Chu, Nam Du; địa hình thấp và bằng phẳng.","Đất chủ yếu là nhóm đất phù sa: phù sa sông (dọc sông Tiền, sông Hậu, độ phì cao), đất phèn (Đồng Tháp Mười, Tứ giác Long Xuyên, bán đảo Cà Mau), đất mặn ven biển; khí hậu cận xích đạo."],task:"Kể tên 3 loại đất chính của vùng và nêu nơi phân bố."},

function drawV(){var el=$('#vp');if(!el){clearInterval(vt);return}var s=SC[vi];el.innerHTML='<div class="vp" style="background:'+s.bg+'"><div class="big">'+s.e+'</div><h3 style="color:#fff;margin:8px 0">'+s.t+'</h3><div class="sub">'+s.s+'</div></div><div class="vb"><i style="width:'+((vi+1)/SC.length*100)+'%"></i></div><p><button class="b" onclick="vToggle()">'+(vplay?'⏸ Tạm dừng':'▶ Phát')+'</button> <button class="b o" onclick="vi=0;vStart()">↺ Phát lại</button> <button class="b g" onclick="go(\'lesson\',\'vung\')">Vào bài học</button></p>'}

function next(){clearInterval(t);if(n>=b.length||lv<=0){$("#sh").innerHTML='<b>'+(lv>0?"🏆":"💔")+' Kết thúc! Em hái được '+s+' sao.</b> <button class="b y" onclick="star()">Chơi lại</button>';$("#sf").innerHTML="";return}

next()}
